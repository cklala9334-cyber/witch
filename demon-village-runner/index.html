<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마계마을 · 붉은 달의 길</title><style>html,body{margin:0;min-height:100%;background:#0d0715;color:#f4d7aa;font-family:system-ui,"Malgun Gothic",sans-serif}body{display:grid;place-items:center}.wrap{width:min(1100px,100%);padding:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}.title{font-size:clamp(18px,3vw,28px);font-weight:900}.pill{background:#241329;border:1px solid #743654;border-radius:99px;padding:7px 12px;font-weight:800}.stage{position:relative;border:3px solid #63304c;border-radius:12px;overflow:hidden}canvas{display:block;width:100%;aspect-ratio:2/1;image-rendering:pixelated}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0b0514c9}.overlay[hidden]{display:none}.card{width:min(88%,430px);text-align:center;background:#27132f;border:2px solid #b54d5c;border-radius:14px;padding:22px;box-shadow:0 0 40px #ff693333}.card h1{margin:0 0 10px}.card p{line-height:1.6;color:#ead0df}.btn{background:#d45d4c;color:#fff0c6;border:0;border-radius:8px;padding:11px 24px;font-weight:900;font-size:16px}.controls{padding-top:9px;color:#caa7ca;font-size:14px}.hint{margin-right:14px}</style></head><body><main class="wrap"><div class="top"><div class="title">⛓ 마계마을 · 붉은 달의 길</div><div><span class="pill" id="score">점수 0</span> <span class="pill" id="state">준비</span></div></div><div class="stage"><canvas id="game" width="960" height="480"></canvas><div class="overlay" id="overlay"><div class="card"><h1>붉은 달의 길</h1><p>마왕성으로 이어진 계단식 화산 마을을 달리세요.<br>← → 이동 · SPACE / ↑ 점프</p><button class="btn" id="start">탐험 시작</button></div></div></div><div class="controls"><span class="hint">고정 사이드뷰 · WebGL 캔버스 · 낡은 쇠사슬과 용암 절벽</span><span>P: 일시정지</span></div></main><script>(()=>{const view=document.querySelector('#game'),gl=view.getContext('webgl',{antialias:false}),W=960,H=480,paint=document.createElement('canvas'),c=paint.getContext('2d'),sprite=new Image();paint.width=W;paint.height=H;sprite.src='../witch-cat-runner/assets/sprite-sheet-alpha.png';let run=false,pause=false,t=0,last=0,cam=0,score=0,keys={};let p={x:140,y:360,vy:0,on:false};const plats=[{x:-100,y:410,w:470},{x:390,y:350,w:210},{x:720,y:295,w:260},{x:1050,y:380,w:270},{x:1370,y:320,w:300},{x:1740,y:255,w:360},{x:2150,y:360,w:430}];const sparks=[{x:470,y:295},{x:810,y:240},{x:1130,y:325},{x:1480,y:265},{x:1870,y:200},{x:2300,y:305}];let got=[];const vs=gl.createShader(gl.VERTEX_SHADER),fs=gl.createShader(gl.FRAGMENT_SHADER);gl.shaderSource(vs,'attribute vec2 p;varying vec2 u;void main(){u=(p+1.0)/2.0;gl_Position=vec4(p,0,1);}');gl.compileShader(vs);gl.shaderSource(fs,'precision mediump float;uniform sampler2D s;varying vec2 u;void main(){gl_FragColor=texture2D(s,u);}');gl.compileShader(fs);const prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);const wx=x=>x-cam;function reset(){p={x:140,y:360,vy:0,on:false};cam=0;score=0;got=[]}function start(){reset();run=true;pause=false;document.querySelector('#overlay').hidden=true;document.querySelector('#state').textContent='탐험 중'}function jump(){if(!run){start();return}if(!pause&&p.on){p.vy=-570;p.on=false}}onkeydown=e=>{keys[e.code]=1;if(['Space','ArrowUp'].includes(e.code)){e.preventDefault();if(!e.repeat)jump()}if(e.code==='KeyP'&&run){pause=!pause;document.querySelector('#state').textContent=pause?'일시정지':'탐험 중'}};onkeyup=e=>keys[e.code]=0;document.querySelector('#start').onclick=start;function poly(a,col){c.fillStyle=col;c.beginPath();a.forEach((v,i)=>i?c.lineTo(v[0],v[1]):c.moveTo(v[0],v[1]));c.closePath();c.fill()}function bg(){let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#170a2c');g.addColorStop(.6,'#331238');g.addColorStop(1,'#12091a');c.fillStyle=g;c.fillRect(0,0,W,H);let moon=wx(785);c.fillStyle='#b73550';c.beginPath();c.arc(moon,98,46,0,7);c.fill();for(let i=0;i<8;i++){let x=wx(i*260+80);poly([[x,320],[x+70,150+(i%3)*22],[x+140,320]],'#3a1649');c.fillStyle='#1e0d2e';c.fillRect(x+60,95+(i%3)*22,8,225)}let cx=wx(1430);c.fillStyle='#24102f';c.fillRect(cx,155,210,165);poly([[cx-25,155],[cx+35,65],[cx+75,155]],'#24102f');poly([[cx+120,155],[cx+175,35],[cx+220,155]],'#24102f');c.fillStyle='#c8454e';c.fillRect(cx+105,140,5,85);poly([[cx+110,145],[cx+158,158],[cx+110,172]],'#db554e');}function props(){let x=wx(20);c.fillStyle='#321733';c.fillRect(x,305,190,105);poly([[x-22,305],[x+32,240],[x+88,272],[x+150,225],[x+212,305]],'#5a2358');c.fillStyle='#dc8043';c.fillRect(x+72,345,38,65);c.fillStyle='#ffc061';c.fillRect(x+137,330,25,24);x=wx(1840);c.fillStyle='#60334f';c.fillRect(x,150,125,120);c.fillStyle='#a53a49';c.fillRect(x+15,165,90,8);c.fillStyle='#ff9143';c.beginPath();c.arc(x+55,255,18,Math.PI,0);c.fill();}function platform(q){let x=wx(q.x);c.fillStyle='#27142f';c.fillRect(x,q.y,q.w,H-q.y);c.fillStyle='#5e2c5b';c.fillRect(x,q.y,q.w,10);c.fillStyle='#9b3c58';for(let i=0;i<q.w;i+=38)c.fillRect(x+i,q.y+15,20,3);c.fillStyle='#e15c3d';c.fillRect(x+30,q.y+10,4,H-q.y-10)}function draw(){bg();props();plats.forEach(platform);sparks.forEach((q,i)=>{if(!got.includes(i)){let x=wx(q.x);c.fillStyle='#ffba49';c.beginPath();c.arc(x,q.y+Math.sin(t*5+i)*4,9,0,7);c.fill()}});if(sprite.complete){let f=Math.floor(t*9)%6;c.drawImage(sprite,f*640,0,640,640,wx(p.x-64),p.y-130,140,140)}c.fillStyle='#f5d8a2';c.font='bold 14px system-ui';c.fillText('← → 이동   SPACE 점프',20,28);document.querySelector('#score').textContent='점수 '+Math.floor(score);gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,paint);gl.useProgram(prog);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}function update(dt){let d=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);p.x+=d*230*dt;p.vy+=1400*dt;p.y+=p.vy*dt;p.on=false;for(const q of plats)if(p.x>q.x-12&&p.x<q.x+q.w&&p.y>=q.y&&p.y<q.y+30&&p.vy>=0){p.y=q.y;p.vy=0;p.on=true}sparks.forEach((q,i)=>{if(!got.includes(i)&&Math.hypot(p.x-q.x,p.y-40-q.y)<35){got.push(i);score+=100}});cam+=(Math.max(0,p.x-230)-cam)*Math.min(1,dt*5);score+=dt*8;if(p.y>H+80){reset();run=false;document.querySelector('#overlay').hidden=false;document.querySelector('#state').textContent='준비'}}function loop(ms){let dt=Math.min(.033,(ms-last)/1000||0);last=ms;t+=dt;if(run&&!pause)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>
